<html lang="en-HK">

    <style type="text/css">
        @font-face {
            font-family: "Chase Zen Blight";
            src: url('/font/English/CHASEZENBLIGHT.ttf');
        }
        @font-face {
            font-family: "DIN Condensed Bold";
            src: url('/font/English/DIN Condensed Bold.ttf');
        }
        @font-face {
            font-family: "DragonForcE";
            src: url('/font/English/DragonForcE.ttf');
        }
        @font-face {
            font-family: "Kremlin";
            src: url('/font/English/Kremlin.ttf');
        }
        @font-face {
            font-family: "Baoli";
            src: url('/font/Chinese/Baoli.ttc');
        }
        :root{
            --background-color: black;
            --intro-background-color: #161616
        }
        @keyframes breathing {
          0% { transform: translate(0rem, 0rem) rotate(0deg); }

          18% { transform: translate(0rem, 0.5rem) rotate(0deg); }
          22% { transform: translate(0rem, 0.75rem) rotate(0deg); }
          28% { transform: translate(0rem, 0.75rem) rotate(0deg); }
          32% { transform: translate(0rem, 0.5rem) rotate(0deg); }

          50% { transform: translate(0rem, 0rem) rotate(0deg); }

          68% { transform: translate(0rem, -0.5rem) rotate(0deg); }
          72% { transform: translate(0rem, -0.75rem) rotate(0deg); }
          78% { transform: translate(0rem, -0.75rem) rotate(0deg); }
          82% { transform: translate(0rem, -0.5rem) rotate(0deg); }

          100% { transform: translate(0rem, 0rem) rotate(0deg); }
        }
    </style>
    <style>
        html {
            background-color:var(--background-color);
        }
        .breathing-animation {
            animation: breathing 6s;
            animation-iteration-count: infinite;
        }
        .intro{
            position: fixed;
            z-index: 3;
            left: 0;
            top: 0;
            width: 100%;
            height: 100vh;
            background-color: var(--intro-background-color);
            transition: 0.8s;
        }
        .intro .text-hidden{
            color: var(--intro-background-color);
            transition: ease-in-out 0.75s;
        }
        .logo-header {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #FFFFFF;
            white-space: nowrap;
        }
        .logo{
            position: relative;
            display: inline-block;
            bottom: -20px;
            opacity: 0;
            height: 2.25rem
        }
        .logo.active{
            bottom: 0;
            opacity: 1;
            transition: ease 0.5s;
        }
        .logo.fade{
            bottom: 150px;
            opacity: 0;
            transition: ease 0.75s;
        }
        .logo-character{
            font-size: 1rem;
            font-family: "Chase Zen Blight";
        }
        .logo-character.readable-font{
            font-size: 2.25rem;
            font-family: DragonForcE;
        }
        .transition-linear {
            transition: linear 1s;
        }
        .transition-ease-in-out {
            transition: ease-in-out 0.75s;
        }
        .text-hidden-pt2 {
            font-size: 0 !important;
            transition: ease 0.5s;
        }


        #id_top {
            z-index: 2;
        }

        .section-header {
            color: #EEEEEE;
        }

        .text-white {
            color: #EEEEEE;
        }

        .text-green {
            color: darkgreen;
        }

        .text-red {
            color: red;
        }

        .text-black {
            color: black;
        }

        .text-hidden {
            color: var(--background-color);
        }

        .text-hover-red {
            transition: color 0.6s ease-in-out; /* transition property for smooth animation */
        }

        .text-hover-red:hover {
            color: red;
        }

        .hover-pointer:hover {
            cursor: pointer;
        }

        .font-Baoli {
            font-family: DragonForcE, Baoli;
        }

        .font-DragonForcE{
            font-family: DragonForcE;
        }

        .uk-lightbox-button, .uk-slidenav{
            color: red !important;
        }
    </style>
</head>
<body style="margin: 0; background-color: black;" id="id_body">
<div id="id_content" class="uk-margin-remove uk-grid-collapse uk-dark" uk-grid>
    <div class="uk-width-1-1">&nbsp;</div>

    <!--Section Script Poster-->
    <div class="uk-margin-small uk-width-1-1">
        <h1 class="uk-text-center section-header font-Baoli">Test<br><s class="text-hidden">儀式紀錄</s></h1>
    </div>

    <div class="uk-margin-small uk-width-1-1 uk-position-relative uk-visible-toggle uk-light" tabindex="-1"
         uk-slider="center: true">
        <div>HP: <span id="hp"><span id="hp_current"></span>/<span id="hp_max"></span></span></div>
        <div>MP: <span id="mp"><span id="mp_current"></span>/<span id="mp_max"></span></span></div>
        <div>SAN: <span id="san"><span id="san_current"></span>/<span id="san_max"></span></span></div>
        <div>CM: <span id="cm"></span></div>
    </div>
</div>

<script type="application/javascript">
    // Define the directory path
    const initial_data = {
        hp: 10,
        mp: 10,
        san: 70,
        cm: 0,

        str: 0,
        dex: 0,
        con: 0,
        pow: 0,
        app: 0,
    }
    let hp_current, hp_max, mp_current, mp_max, san_current, san_max, cm;
    let str, str_temp, str_perm, dex, dex_temp, dex_perm, con, con_temp, con_perm;
    let pow, pow_temp, pow_perm, app, app_temp, app_perm;
    let action = null;

    function load_data() {
        console.log("load_data")
        let saved_data = null;
        if (saved_data == null) {
            hp_current = initial_data.hp;
            hp_max = initial_data.hp;
            mp_current = initial_data.mp;
            mp_max = initial_data.mp;
            san_current = initial_data.san;
            san_max = 99 - initial_data.cm;
            cm = initial_data.cm;
            return false;
        }
        hp_current = saved_data.hp_current;
        hp_max = saved_data.hp_max;
        mp_current = saved_data.mp_current;
        mp_max = saved_data.mp_max;
        san_current = saved_data.san;
        san_max = 99 - saved_data.cm;
        cm = saved_data.cm;
    }

    function display() {
        console.log("display")
        $("#hp_max").text(hp_max);
        $("#hp_current").text(hp_current);
        $("#mp_max").text(mp_max);
        $("#mp_current").text(mp_current);
        $("#san_max").text(san_max);
        $("#san_current").text(san_current);
        $("#cm").text(cm);
    }

    $(document).ready(function() {
        load_data();
        display();
    })
</script>
</body>
</html>
