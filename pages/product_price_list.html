<html lang="en-HK">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>IdeaTrpg</title>
    <meta name="author" content="IdeaTrpg">
    <link rel="icon" type="image/x-icon" href="img/logo/Logo_Ig.png">
    <meta property="og:url" content="https://ideatrpg.com/">
    <meta property="og:site_name" content="IdeaTrpg">
    <meta property="og:title" content="IdeaTrpg">
    <meta property="og:type" content="website">
    <meta property="og:image"
          content="img/Logo_Ig.png">
    <meta property="og:locale" content="en_HK">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="IdeaTrpg">
    <meta name="twitter:image"
          content="img/Logo_Ig.png">
    <meta name="twitter:image:alt" content="IdeaTrpg">
    <meta name="theme-color" content="#000000">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"
            integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
    <!-- jQuery UI -->
    <script src="https://code.jquery.com/ui/1.13.1/jquery-ui.min.js"
            integrity="sha256-eTyxS0rkjpLEo16uXTS0uVCS4815lc40K2iVpWDvdSY=" crossorigin="anonymous"></script>
    <!-- Fontawesome JS -->
    <script src="https://kit.fontawesome.com/c5fabdd5cd.js" crossorigin="anonymous"></script>
    <!-- Syncfusion CSS -->
    <link href="https://cdn.syncfusion.com/ej2/material.css" rel="stylesheet" type="text/css"/>
    <!-- Syncfusion JS -->
    <script src="https://cdn.syncfusion.com/ej2/dist/ej2.min.js" type="text/javascript"></script>
    <!-- UIkit CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uikit@3.14.3/dist/css/uikit.min.css"/>
    <!-- UIkit JS -->
    <script src="https://cdn.jsdelivr.net/npm/uikit@3.14.3/dist/js/uikit.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/uikit@3.14.3/dist/js/uikit-icons.min.js"></script>

    <style type="text/css">
        @font-face {
            font-family: "Chase Zen Blight";
            src: url('/font/English/CHASEZENBLIGHT.ttf');
        }

        @font-face {
            font-family: "DIN Condensed Bold";
            src: url('/font/English/DIN Condensed Bold.ttf');
        }

        @font-face {
            font-family: "DragonForcE";
            src: url('/font/English/DragonForcE.ttf');
        }

        @font-face {
            font-family: "Kremlin";
            src: url('/font/English/Kremlin.ttf');
        }

        @font-face {
            font-family: "Baoli";
            src: url('/font/Chinese/Baoli.ttc');
        }

        :root {
            --background-color: black;
            --intro-background-color: #161616
        }

        @keyframes breathing {
            0% {
                transform: translate(0rem, 0rem) rotate(0deg);
            }

            18% {
                transform: translate(0rem, 0.5rem) rotate(0deg);
            }
            22% {
                transform: translate(0rem, 0.75rem) rotate(0deg);
            }
            28% {
                transform: translate(0rem, 0.75rem) rotate(0deg);
            }
            32% {
                transform: translate(0rem, 0.5rem) rotate(0deg);
            }

            50% {
                transform: translate(0rem, 0rem) rotate(0deg);
            }

            68% {
                transform: translate(0rem, -0.5rem) rotate(0deg);
            }
            72% {
                transform: translate(0rem, -0.75rem) rotate(0deg);
            }
            78% {
                transform: translate(0rem, -0.75rem) rotate(0deg);
            }
            82% {
                transform: translate(0rem, -0.5rem) rotate(0deg);
            }

            100% {
                transform: translate(0rem, 0rem) rotate(0deg);
            }
        }
    </style>
    <style>
        html {
            background-color: var(--background-color);
        }

        .breathing-animation {
            animation: breathing 6s;
            animation-iteration-count: infinite;
        }

        .intro {
            position: fixed;
            z-index: 3;
            left: 0;
            top: 0;
            width: 100%;
            height: 100vh;
            background-color: var(--intro-background-color);
            transition: 0.8s;
        }

        .intro .text-hidden {
            color: var(--intro-background-color);
            transition: ease-in-out 0.75s;
        }

        .logo-header {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #FFFFFF;
            white-space: nowrap;
        }

        .logo {
            position: relative;
            display: inline-block;
            bottom: -20px;
            opacity: 0;
            height: 2.25rem
        }

        .logo.active {
            bottom: 0;
            opacity: 1;
            transition: ease 0.5s;
        }

        .logo.fade {
            bottom: 150px;
            opacity: 0;
            transition: ease 0.75s;
        }

        .logo-character {
            font-size: 1rem;
            font-family: "Chase Zen Blight";
        }

        .logo-character.readable-font {
            font-size: 2.25rem;
            font-family: DragonForcE;
        }

        .transition-linear {
            transition: linear 1s;
        }

        .transition-ease-in-out {
            transition: ease-in-out 0.75s;
        }

        .text-hidden-pt2 {
            font-size: 0 !important;
            transition: ease 0.5s;
        }


        #id_top {
            z-index: 2;
        }

        .section-header {
            color: #EEEEEE;
        }

        .text-white {
            color: #EEEEEE;
        }

        .text-green {
            color: darkgreen;
        }

        .text-red {
            color: red;
        }

        .text-black {
            color: black;
        }

        .text-hidden {
            color: var(--background-color);
        }

        .text-hover-red {
            transition: color 0.6s ease-in-out; /* transition property for smooth animation */
        }

        .text-hover-red:hover {
            color: red;
        }

        .hover-pointer:hover {
            cursor: pointer;
        }

        .font-Baoli-DragonForcE {
            font-family: DragonForcE, Baoli;
        }

        .font-Baoli {
            font-family: Baoli;
        }

        .font-DragonForcE {
            font-family: DragonForcE;
        }

        .font-DINCondensed{
            font-family: "DIN Condensed Bold", Baoli;
        }

        .uk-lightbox-button, .uk-slidenav {
            color: red !important;
        }
    </style>
</head>
<body style="margin: 0; background-color: black;" id="id_body">
<div id="id_content" class="uk-margin-remove uk-grid-collapse uk-dark" uk-grid>
    <div class="uk-width-1-1">&nbsp;</div>

    <!--Section Script Poster-->
    <div class="uk-margin-small uk-width-1-1">
        <h1 class="uk-text-center section-header font-Baoli">Product</h1>
    </div>

    <div class="uk-margin-small uk-width-1-2 uk-position-relative uk-visible-toggle uk-light" tabindex="-1"
         style="max-height: 930px;"
         uk-slider="center: true; autoplay: true; autoplay-interval: 6000">
        <div class="uk-slider-items uk-child-width-1-1" id="id_product_carousel" uk-grid
             uk-lightbox="animation: slide"></div>
    </div>

    <div class="uk-margin-small uk-width-1-2">
        <h1 class="uk-text-center font-Baoli text-white" style="margin-bottom: 0px;">Price List</h1>
        <div class="uk-width-1-1 uk-height-large uk-inline uk-section uk-padding-remove-top"
             style="min-height: 360px;">
            <div class="uk-position-bottom uk-margin-medium-left uk-margin-medium-bottom uk-container text-white"
                 style="height: 360px">
                <p class="uk-text-large font-Baoli"
                   style="white-space: pre-line; font-size: 55px; line-height: 1.5">
                    IDEA 文件夾: HKD 10
                    IDEA 環保袋: HKD 20
                    IDEA 平安御守: HKD 20
                    IDEA 筆記簿: HKD 30

                    每次消費滿HKD <span class="text-red">60</span>，
                    即送IDEA環保袋乙個
                </p>
            </div>
        </div>
    </div>
</div>

<script type="application/javascript">
    // Define the directory path
    const posterDirectory = '/img/product/';
    const posterArray = [
        {"path": "product_01.JPG", "name": "Product 01", "caption": "Product 01"},
        {"path": "product_02.JPG", "name": "Product 02", "caption": "Product 02"},
        {"path": "product_03.JPG", "name": "Product 03", "caption": "Product 03"},
        {"path": "product_04.JPG", "name": "Product 04", "caption": "Product 04"},
        {"path": "product_05.JPG", "name": "Product 05", "caption": "Product 05"},
    ];

    const productCarousel = $('#id_product_carousel');
    for (const posterElement of posterArray) {
        productCarousel.append(
            '<div>' +
            '<a class="uk-inline" href="' + posterDirectory + posterElement.path + '" data-caption="' + posterElement.caption + '" uk-lightbox="{group:\'script-poster\'}">' +
            "<img src='" + posterDirectory + posterElement.path + "' width='800' height='800' alt='" + posterElement.name + "' loading=\"eager\">" +
            "</a>" +
            "</div>"
        );
    }
</script>
</body>
</html>
